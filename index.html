<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAVASIDE | Independent Game Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d10;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    h1 {
      font-size: 3.5rem;
      letter-spacing: 6px;
      color: #ffffff;
      text-transform: uppercase;
      font-weight: 800;
    }
    p.subtitle {
      color: #ff5500; /* Subtle lava accent color */
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      font-weight: 600;
    }
    .card {
      background: #14171d;
      border: 1px solid #232833;
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .card h2 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .card p {
      color: #9ba8b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-steam {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #171a21 0%, #2a475e 100%);
      color: #67c1f5;
      border: 1px solid #67c1f5;
      padding: 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn-steam:hover {
      background: #2a475e;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(103, 193, 245, 0.4);
    }
    footer {
      margin-top: 3.5rem;
      text-align: center;
      color: #586579;
      font-size: 0.9rem;
    }
    a.email {
      color: #8b9bb4;
      text-decoration: none;
      font-weight: 500;
    }
    a.email:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>LAVASIDE</h1>
    <p.subtitle>INDEPENDENT GAME STUDIO</p.subtitle>
  </div>

  <div class="card">
    <h2>[YOUR GAME TITLE]</h2>
    <p>[A short 1-2 sentence hook describing your game mechanics and core loop.]</p>
    <a href="[YOUR_STEAM_WISHLIST_URL]" class="btn-steam" target="_blank">WISHLIST ON STEAM</a>
  </div>

  <footer>
    <p>Contact: <a href="mailto:lavasidegames@gmail.com" class="email">aughscot@gmail.com</a></p>
    <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #3d4654;">&copy; LAVASIDE. All rights reserved.</p>
  </footer>

</body>
</html>
