<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAVASIDE | Independent Game Studio</title>
  <style>
    body {
      background-color: #0f1115;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      margin-bottom: 0.2em;
      color: #ffffff;
    }
    p.subtitle {
      color: #8b9bb4;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: #181b22;
      border: 1px solid #282d37;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .btn-steam {
      display: inline-block;
      background: linear-gradient(135deg, #171a21 0%, #2a475e 100%);
      color: #67c1f5;
      border: 1px solid #67c1f5;
      padding: 14px 28px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.2s ease;
    }
    .btn-steam:hover {
      background: #2a475e;
      color: #ffffff;
    }
    footer {
      margin-top: 3rem;
      color: #586579;
      font-size: 0.9rem;
    }
    a.email { color: #8b9bb4; text-decoration: none; }
  </style>
</head>
<body>

  <h1>LAVASIDE</h1>
  <p class="subtitle">INDEPENDENT GAME STUDIO</p>

  <div class="card">
    <h2>[Your Game Title Here]</h2>
    <p>[A short 1-2 sentence hook about your game's mechanics or vision.]</p>
    <a href="[YOUR_STEAM_WISHLIST_LINK]" class="btn-steam" target="_blank">Wishlist on Steam</a>
  </div>

  <footer>
    <p>Contact: <a href="mailto:lavasidegames@gmail.com" class="email">lavasidegames@gmail.com</a></p>
    <p>&copy; LAVASIDE. All rights reserved.</p>
  </footer>

</body>
</html>
